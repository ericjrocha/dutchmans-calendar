<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dutchman's Content Calendar</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Brand: charcoal menu-board ground, mustard banners, red stars, white condensed type (from the Dutchman's logo and menu boards).
   Layout: logo header, page tabs (Calendar / Ideas / Menu / Profile), banner-style section heads. Single dark look by design. */
:root {
  --bg: #21201E;
  --surface: #2A2826;
  --surface-2: #34312E;
  --line: #4A4540;
  --fg: #F7F3EA;
  --fg-2: #B4ABA0;
  --gold: #BD930B;
  --gold-ink: #1B1304;
  --gold-text: #E2B22A;
  --red: #CD4C2D;
  --red-text: #EE6B4C;
  --sage: #6FB58A;
  --sky: #6FA3D8;
  --teal: #4FB3AE;
  --closed: #9A9187;
  --today: #3B2A16;
  --font-display: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "Roboto", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }
.d { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; text-transform: uppercase; }

.wrap { max-width: 1320px; margin: 0 auto; padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-block: 18px 14px; }
.logo { display: flex; align-items: center; gap: 18px; min-width: 0; }
.logo img { width: clamp(120px, 18vw, 190px); height: auto; display: block; }
.logo .t { min-width: 0; }
.logo h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 4.4vw, 52px); line-height: .95; margin: 0; letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.logo p { margin: 6px 0 0; color: var(--fg-2); font-size: 13.5px; }
.hours { text-align: right; font-size: 13px; color: var(--fg-2); line-height: 1.55; }
.hours b { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--gold-text); letter-spacing: .04em; margin-right: 6px; }
.stars { color: var(--red); letter-spacing: .3em; }

/* page tabs: styled like the menu-board banner */
.tabs { display: flex; gap: 6px; background: var(--gold); padding: 6px; border-radius: 3px; overflow-x: auto; }
.tabs button { flex: 1 1 0; min-width: max-content; border: 0; background: transparent; color: var(--gold-ink); font-family: var(--font-display); font-size: 24px; letter-spacing: .06em; padding: 6px 18px 3px; border-radius: 2px; }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); }
.tabs button .s { color: var(--red); margin-right: 6px; font-size: 15px; vertical-align: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; padding: 18px 0 12px; }
.months { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 4px; border: 1px solid var(--line); }
.months button { border: 0; background: transparent; padding: 6px 14px 3px; border-radius: 3px; font-family: var(--font-display); font-size: 22px; letter-spacing: .05em; color: var(--fg-2); }
.months button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 -3px 0 var(--red); }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 9px 14px; color: var(--fg-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.btn { border: 0; background: var(--red); color: #fff; font-weight: 700; letter-spacing: .02em; padding: 10px 18px; border-radius: 4px; }
.btn:hover { filter: brightness(1.1); }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--red-text); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

.layers { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
.layer { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px 6px 10px; font-size: 13px; font-weight: 500; }
.layer i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.layer[aria-pressed="false"] { opacity: .45; }
.layer[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.hint { color: var(--fg-2); font-size: 12.5px; margin: 0 0 12px; }

/* calendar */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--gold); color: var(--gold-ink); }
.dow div { padding: 7px 10px 4px; font-family: var(--font-display); font-size: 18px; letter-spacing: .08em; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.day { min-height: 124px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; background: var(--surface); min-width: 0; cursor: pointer; }
.day:nth-child(7n) { border-right: 0; }
.day.out { background: var(--bg); }
.day.out .num { opacity: .35; }
.day:hover { background: var(--surface-2); }
.day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--gold-text); }
.day.today { background: var(--today); }
.day.drop { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--red); }
.num { font-family: var(--font-display); font-size: 20px; width: 28px; height: 26px; display: grid; place-items: center; border-radius: 3px; letter-spacing: .02em; padding-top: 2px; }
.today .num { background: var(--red); color: #fff; }
.chip { display: flex; gap: 5px; align-items: baseline; font-size: 12px; line-height: 1.25; padding: 3px 6px; border-radius: 3px; background: color-mix(in srgb, var(--c) 20%, transparent); border-left: 3px solid var(--c); min-width: 0; }
.chip.dim { background: transparent; border-left-style: dashed; color: var(--fg-2); }
.chip.draft { background: transparent; border-left-style: dotted; }
.chip.closure { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, transparent) 0 6px, color-mix(in srgb, var(--c) 12%, transparent) 6px 12px); font-weight: 700; }
.chip.mine { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent); }
.chip.gone, .item.gone h3 { text-decoration: line-through; opacity: .6; }
.chip .t { font-size: 10.5px; color: var(--fg-2); flex: none; font-variant-numeric: tabular-nums; }
.chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.more { font-size: 11.5px; color: var(--fg-2); padding-left: 6px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: .95; margin: 0; letter-spacing: .03em; text-transform: uppercase; }
.panel .sub { color: var(--fg-2); font-size: 13px; margin: 6px 0 14px; }
.items { display: flex; flex-direction: column; gap: 10px; margin: 0 0 14px; padding: 0; list-style: none; }
.item { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 4px; padding: 10px 12px; background: var(--bg); }
.item.closure { background: repeating-linear-gradient(135deg, rgba(154,145,135,.12) 0 8px, transparent 8px 16px); }
.item .top2 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.item h3 { margin: 0; font-size: 15px; font-weight: 700; }
.item .time { font-size: 12.5px; color: var(--fg-2); flex: none; font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: color-mix(in srgb, var(--c) 24%, transparent); color: var(--fg); }
.tag.plain { background: var(--surface-2); color: var(--fg-2); }
.cap { margin: 8px 0 0; font-size: 13px; color: var(--fg-2); white-space: pre-line; }
.item .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.item a { color: var(--gold-text); font-size: 12.5px; }
.empty { color: var(--fg-2); font-size: 14px; padding: 8px 0 14px; }

/* banner section heads (menu board style) */
.banner { background: var(--gold); color: var(--gold-ink); text-align: center; padding: 8px 14px 3px; margin: 0 0 18px; display: flex; align-items: center; justify-content: center; gap: 14px; }
.banner h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4vw, 42px); letter-spacing: .05em; text-transform: uppercase; line-height: 1.05; }
.banner .st { color: var(--red); font-size: 22px; }
.banner .pr { font-size: 20px; color: #fff; font-family: var(--font-display); letter-spacing: .04em; }
.pageintro { text-align: center; color: var(--fg-2); margin: 24px auto 22px; max-width: 640px; font-size: 14px; }

.agenda { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 18px 18px; }
.agenda h3.dh { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .05em; margin: 20px 0 8px; color: var(--gold-text); }
.mhead { font-family: var(--font-display); font-size: 36px; letter-spacing: .05em; margin: 22px 0 0; padding-top: 10px; border-top: 3px solid var(--red); }
.mhead:first-child { margin-top: 12px; }
.agenda .items { max-width: 720px; }

/* ideas */
.ideas { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 22px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: .04em; margin: 0 0 4px; text-transform: uppercase; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.fchips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.fchips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.idea { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.idea:first-of-type { border-top: 0; }
.idea .dt { text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 0 3px; }
.idea .dt b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: .95; }
.idea .dt span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); font-weight: 700; }
.idea h4 { margin: 0; font-size: 15px; font-weight: 700; }
.idea p { margin: 2px 0 0; font-size: 13px; color: var(--fg-2); }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; background: var(--surface-2); color: var(--fg-2); margin-right: 6px; }
.badge.warn { background: rgba(226,178,42,.18); color: var(--gold-text); }
.mh { font-family: var(--font-display); font-size: 30px; letter-spacing: .05em; margin: 22px 0 2px; color: var(--gold-text); }
.mh:first-of-type { margin-top: 4px; }

/* menu */
.menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 40px; }
.msec { min-width: 0; }
.msec.wide { grid-column: 1 / -1; }
.mi { padding: 10px 0; text-align: center; }
.mi h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
.mi h4 small { font-size: 18px; color: var(--fg-2); margin-left: 6px; }
.mi p { margin: 4px auto 0; max-width: 46ch; font-size: 13.5px; font-weight: 500; }
.mi.hot h4 { color: var(--gold-text); }
.msub { text-align: center; font-family: var(--font-display); font-size: 20px; letter-spacing: .06em; margin: -6px 0 6px; color: var(--fg-2); }
.sides { border: 2px dashed var(--gold); padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; text-align: center; font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; margin-top: 14px; }
.sides .new { color: var(--red-text); outline: 2px dashed var(--red); outline-offset: 4px; }
.sidehead { text-align: center; font-family: var(--font-display); font-size: 34px; margin: 22px 0 6px; letter-spacing: .05em; }
.sidehead small { font-size: 22px; color: var(--fg-2); }
.specials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.sp { border: 1px solid var(--line); border-top: 4px solid var(--red); background: var(--surface); padding: 12px 14px; border-radius: 4px; }
.sp b { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: .05em; color: var(--gold-text); display: block; }
.sp span { font-size: 13.5px; }
.fine { text-align: center; color: var(--fg-2); font-size: 12px; margin-top: 26px; }
.cta { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
a.btn { text-decoration: none; display: inline-block; }

/* bands */
.bandgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.show { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.show:first-of-type { border-top: 0; }
.show .dt { text-align: center; background: var(--gold); color: var(--gold-ink); border-radius: 3px; padding: 6px 0 3px; }
.show .dt b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: .9; }
.show .dt span { font-family: var(--font-display); font-size: 16px; letter-spacing: .1em; }
.show h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: .04em; line-height: 1; text-transform: uppercase; }
.show p { margin: 3px 0 0; color: var(--fg-2); font-size: 13.5px; }
.show.past { opacity: .6; }
.show .row { display: flex; gap: 6px; }
.wk { font-family: var(--font-display); font-size: 20px; letter-spacing: .08em; color: var(--red-text); margin: 18px 0 0; }
.wk:first-child { margin-top: 0; }

/* modal & form */
.scrim { position: fixed; inset: 0; background: rgba(8, 7, 6, .72); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 6px; width: min(500px, 100%); max-height: 100%; overflow: auto; padding: 22px; border: 1px solid var(--line); border-top: 6px solid var(--gold); }
.modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; letter-spacing: .04em; margin: 0 0 12px; text-transform: uppercase; }
.f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.f label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.f input, .f select, .f textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; width: 100%; min-width: 0; }
.f textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.toast { position: fixed; bottom: max(18px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); font-weight: 500; }
.note { font-size: 12.5px; color: var(--fg-2); margin: 0 0 12px; }

@media (max-width: 1000px) {
  .main, .ideas, .bandgrid { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  .hours { text-align: left; }
}
@media (max-width: 700px) {
  .menu { grid-template-columns: minmax(0, 1fr); }
  .specials { grid-template-columns: minmax(0, 1fr); }
  .sides { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .day { min-height: 58px; padding: 4px; align-items: center; }
  .day .chip, .day .more { display: none; }
  .dots { display: flex; justify-content: center; }
  .dow div { padding: 6px 2px 3px; text-align: center; font-size: 14px; letter-spacing: 0; }
  .num { font-size: 18px; }
  .months button { padding: 6px 9px 3px; font-size: 19px; }
  .two { grid-template-columns: 1fr; }
  .show, .idea { grid-template-columns: 58px minmax(0, 1fr); }
  .show .row, .idea .act { grid-column: 2; }
  .tabs button { font-size: 20px; padding: 6px 12px 3px; }
}
.prof { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.prof .wide { grid-column: 1 / -1; }
.prow { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; font-size: 14px; }
.prow:first-of-type { border-top: 0; }
.prow span { color: var(--fg-2); font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.prow b { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.prow em { font-style: normal; color: var(--gold-text); font-size: 13px; }
.prow a { color: var(--gold-text); }
@media (max-width: 700px) { .prof { grid-template-columns: minmax(0, 1fr); } .prow { grid-template-columns: 110px minmax(0, 1fr); } .prow em { grid-column: 2; } }
@media (prefers-reduced-motion: no-preference) {
  .day, .btn, .layer { transition: background .12s, opacity .12s, filter .12s; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <img src="logo.png" alt="Dutchman's Country BBQ, established 2024">
      <div class="t">
        <h1>Content <span style="color:var(--gold-text)">Calendar</span></h1>
        <p><span class="stars">&#9733; &#9733; &#9733;</span>&nbsp; 1615 N Apache Trail, Apache Junction, AZ</p>
      </div>
    </div>
    <div class="hours"><div><b>Sun&ndash;Thu</b>11a &ndash; 8p</div><div><b>Fri&ndash;Sat</b>11a &ndash; 10p</div></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Pages"></nav>

  <section id="pg-calendar">
    <div class="bar">
      <div class="months" id="months" role="group" aria-label="Month"></div>
      <div class="actions">
        <div class="seg" role="group" aria-label="View">
          <button id="v-cal" aria-pressed="true">Calendar</button>
          <button id="v-agenda" aria-pressed="false">Agenda</button>
        </div>
        <button class="btn" id="add-top">+ Add to calendar</button>
      </div>
    </div>
    <div class="layers" id="layers" role="group" aria-label="Show on calendar"></div>
    <p class="hint" id="drag-hint">Everything here comes from the CRE818 planning sheet. Items you add go to CRE818 as requests.</p>
    <div id="calview" class="main">
      <section class="cal" aria-label="Month calendar">
        <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div class="grid" id="grid"></div>
      </section>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
    <div id="agendaview" class="agenda" hidden></div>
  </section>

  <section id="pg-ideas" hidden></section>
  <section id="pg-menu" hidden></section>
  <section id="pg-profile" hidden></section>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  /* ================= SETUP =================
     Paste the Google Apps Script web app URL between the quotes (it ends in /exec).
     Left empty, events save only in each visitor's own browser. */
  var SHEET_API = 'https://script.google.com/macros/s/AKfycbxQXlbH0ZYmmMtxbGO6nLzWR1XcQwMO0CqB2-dX2XtmU07IShMpVbmgXYguE0oCsjmNVA/exec';

  /* ================= DATA =================
     Everything on the calendar comes from the Plan tab of the planning sheet.
     The lists below only feed the Ideas, Menu and Profile pages. */

  /* Ideas. src: where the date came from. c = true when sources disagree or the date is not confirmed. */

      var c = choice(), t = c ? c[2] : 'se';

      q('tl').textContent = c ? c[3] || 'Start time' : 'Start time'; q('el').textContent = c ? (t === 'e' ? c[3] : 'Until') : 'End time';
    }
    q('kind').onchange = sync; q('hours').onchange = sync; sync();
    q('form').onsubmit = function (ev) {
      ev.preventDefault();
      var k = q('kind').value, c = choice(), title = q('title').value.trim(), notes = q('notes').value.trim();
      if (!title && k === 'Private Event') title = 'Closed for private event';
      if (!title && k === 'Hours Change') title = 'Hours change';
      if (!title) { q('title').focus(); toast('Add a title first.'); return; }
      if (!q('date').value) { q('date').focus(); return; }
      var start = q('srow').hidden || q('trow').hidden ? '' : q('time').value, end = q('erow').hidden || q('trow').hidden ? '' : q('etime').value;
      var hoursText = '';
      if (c) {
        hoursText = c[1];
        if (c[2] === 'e' && end) hoursText += ' at ' + t12(end);
        else if (c[2] === 's' && start) hoursText += ' at ' + t12(start);
        else if (c[2] === 'se' && start) hoursText += ', ' + t12(start) + (end ? ' to ' + t12(end) : '');
        hoursText += '.';
      }
      add({ kind: k, title: title, date: q('date').value, start: start, end: end, details: (hoursText + (hoursText && notes ? ' ' : '') + notes).slice(0, 600) });
    };
    return q;
  }
  function openForm(date, preset) {
    var e = preset || { date: date, kind: 'Event', title: '', details: '' };
    $('modal-root').innerHTML = '<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Add to calendar</h2><div id="m-wrap"></div></div></div>';
    var root = $('m-wrap'); root.innerHTML = formHTML(e, 'm');
    var q = wireForm(root, 'm'); var cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'btn ghost'; cancel.textContent = 'Cancel'; cancel.onclick = closeForm; q('foot').prepend(cancel);
    $('scrim').addEventListener('mousedown', function (ev) { if (ev.target.id === 'scrim') closeForm(); }); q('title').focus();
  }
  function closeForm() { $('modal-root').innerHTML = ''; }

  /* ================= PLANNING SHEET: load, add, ask to remove ================= */
  function jump(date) { state.ym = date.slice(0, 7); state.sel = date; }
  async function apiPost(body) {
    var r = await fetch(SHEET_API, { method: 'POST', body: JSON.stringify(body) });
    var j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Save failed');
    return j;
  }
  async function add(rec) {
    if (!api) { toast('The shared plan is not connected yet.'); return; }
    if (busy) return; busy = true;
    try {
      var j = await apiPost({ action: 'add', item: rec });
      items = items.concat([j.item]); closeForm(); jump(j.item.date);
      state.on[(KIND[j.item.kind] || KIND.Other).layer] = true;
      renderAll(); toast('Sent to CRE818. It shows as Requested.');
    } catch (err) { toast('Could not send that. Check the connection and try again.'); }
    finally { busy = false; }
  }
  async function askRemove(id) {
    try {
      await apiPost({ action: 'remove', id: id });
      items = items.map(function (x) { return x.id === id ? Object.assign({}, x, { stage: 'Remove Requested' }) : x; });
      renderAll(); toast('Sent to CRE818 to take off.');
    } catch (err) { toast('Could not send that. Try again.'); }
  }
  async function load() {
    if (!api) { loaded = true; failed = true; renderAll(); return; }
    if (busy || document.querySelector('.scrim')) return;
    try {
      var r = await fetch(SHEET_API + (SHEET_API.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now());
      var j = await r.json();
      if (!j.ok) throw new Error(j.error);
      items = (j.items || []).filter(function (i) { return i.date; }); loaded = true; failed = false; renderAll();
    } catch (err) { if (!loaded) { loaded = true; failed = true; renderAll(); } }
  }

  /* ================= MENU PAGE ================= */
  function mi(x) { return '<div class="mi' + (x[3] ? ' hot' : '') + '"><h4>' + esc(x[0]) + (x[1] ? '<small>' + esc(x[1]) + '</small>' : '') + '</h4>' + (x[2] ? '<p>' + esc(x[2]) + '</p>' : '') + '</div>'; }
  function ban(t, pr) { return '<div class="banner"><span class="st">&#9733;</span><h2>' + t + '</h2>' + (pr ? '<span class="pr">' + pr + '</span>' : '') + '<span class="st">&#9733;</span></div>'; }
  function renderMenu() {
    var s = MENU.smoker, sp = [1, 2, 3].map(function (d) { return '<div class="sp"><b>' + DOW[d] + '</b><span>' + esc(SPECIALS[d][1]) + '</span></div>'; }).join('');
    $('pg-menu').innerHTML = '<p class="pageintro">Menu as printed on the boards at dutchmansbbq.com/menu. Use it for captions and to check prices before a post goes out.</p>' +
      '<div class="specials">' + sp + '</div><div class="menu">' +
      '<div class="msec">' + ban('From the smoker') + '<div class="msub">' + s.note + '</div>' + s.items.map(function (x) { return mi([x[0], x[1]]); }).join('') + mi([s.sampler[0], s.sampler[1], s.sampler[2], 1]) + '<div class="sidehead">Sides <small>4.99</small></div><div class="sides">' + s.sides.map(function (x, i) { return '<div' + (i === 2 ? ' class="new"' : '') + '>' + esc(x) + '</div>'; }).join('') + '</div></div>' +
      '<div class="msec">' + ban('Dutchman’s BBQ bites') + MENU.bites.map(mi).join('') + '</div>' +
      '<div class="msec">' + ban('BBQ sandwiches') + '<div class="msub">Choice of 1 side</div>' + MENU.sandwiches.map(mi).join('') + '</div>' +
      '<div class="msec">' + ban('Salads &amp; BBQ stacks') + MENU.stacks.map(mi).join('') + '</div>' +
      '<div class="msec">' + ban('Tacos', '11.99') + MENU.tacos.map(mi).join('') + '</div>' +
      '<div class="msec">' + ban('Crispy &amp; crunchy') + MENU.crispy.map(mi).join('') + '</div>' +
      '<div class="msec wide">' + ban('Dessert', '5.99') + '<div class="sides" style="grid-template-columns:repeat(3,minmax(0,1fr));border-style:solid">' + MENU.dessert.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join('') + '</div></div></div>' +
      '<div class="cta"><a class="btn gold" href="https://order.toasttab.com/online/dutchmans-county-bbq-new-1615-n-apache-trail" target="_blank" rel="noopener">Order online</a><a class="btn ghost" href="https://www.dutchmansbbq.com/menu" target="_blank" rel="noopener">Menu on the website</a></div>' +
      '<p class="fine">Consuming raw or undercooked meats may increase your risk of foodborne illness, especially if you have certain medical conditions. Phone (480) 625-1265.</p>';
  }


  /* ================= PROFILE PAGE ================= */
  function renderProfile() {
    var hrs = [['Monday', '11 AM – 8 PM'], ['Tuesday', '11 AM – 8 PM'], ['Wednesday', '11 AM – 8 PM'], ['Thursday', '11 AM – 8 PM'], ['Friday', '11 AM – 10 PM'], ['Saturday', '11 AM – 10 PM'], ['Sunday', '11 AM – 8 PM']];
    var links = [['Website', 'https://www.dutchmansbbq.com/', 'dutchmansbbq.com'], ['Instagram', 'https://www.instagram.com/dutchmansbbq', '@dutchmansbbq'], ['TikTok', 'https://www.tiktok.com/@dutchmanscountrybbq', '@dutchmanscountrybbq'], ['Facebook', 'https://www.facebook.com/dutchmanscountrybbq', 'dutchmanscountrybbq'], ['Order online', 'https://order.toasttab.com/online/dutchmans-county-bbq-new-1615-n-apache-trail', 'Toast ordering']];
    var staff = [['Tom Misitano', 'Owner'], ['Clay Eager', ''], ['Kirk Stevens', ''], ['Shari Hardin', '']];
    var camps = [['Monday special', 'Pulled Pork Sandwich + choice of side $9.99, $4 margaritas', 'Every Monday'], ['Tuesday tacos', '$3 off tacos', 'Every Tuesday'], ['Wednesday stuffed potato', '$3 off the DCB Loaded Potato', 'Every Wednesday'], ['Weekend music', 'Promote the Friday to Sunday lineup', 'Weekends'], ['Friday musician feature', 'Promote tonight’s artist', 'Fridays'], ['Sunday musician feature', 'Promote tonight’s artist', 'Sundays']];
    var hol = [['Veterans Day', 'Wed, Nov 11', 'Not set'], ['Thanksgiving Day', 'Thu, Nov 26', 'Closed'], ['Cyber Monday', 'Mon, Nov 30', 'Not set'], ['Christmas Eve', 'Thu, Dec 24', 'Not set'], ['Christmas Day', 'Fri, Dec 25', 'Not set']];
    var li = function (a, b, c) { return '<div class="prow"><span>' + a + '</span><b>' + b + '</b>' + (c ? '<em>' + c + '</em>' : '') + '</div>'; };
    $('pg-profile').innerHTML = ban('Client profile') +
      '<div class="prof">' +
      '<div class="card"><h3>Basics</h3>' + li('Client', 'Dutchman’s Country BBQ') + li('Client under', 'Hospitality First') + li('Main contact', 'Clay Eager') + li('Restaurant phone', '(480) 625-1265') + li('Location', '1615 N Apache Trail<br>Apache Junction, AZ 85119') + '</div>' +
      '<div class="card"><h3>Hours</h3>' + hrs.map(function (h) { return li(h[0], h[1]); }).join('') + '</div>' +
      '<div class="card"><h3>Links</h3>' + links.map(function (l) { return li(l[0], '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[2] + '</a>'); }).join('') + '</div>' +
      '<div class="card"><h3>Key staff</h3>' + staff.map(function (p) { return li(p[0], p[1] || '—'); }).join('') + '</div>' +
      '<div class="card wide"><h3>Campaigns</h3><p class="note">Updated for October 2026.</p>' + camps.map(function (c) { return li(c[0], c[1], c[2]); }).join('') + '</div>' +
      '<div class="card wide"><h3>Holidays &amp; observances</h3><p class="note">Open or closed is set per holiday. Add or change hours on the Calendar or Ideas page.</p>' + hol.map(function (c) { return li(c[0], c[1], c[2]); }).join('') + '</div>' +
      '</div><p class="fine">Account logins and passwords are kept private and are not shown on this page.</p>';
  }


  /* ================= ROUTING / RENDER ================= */
  function renderTabs() { $('tabs').innerHTML = PAGES.map(function (p) { return '<button role="tab" data-page="' + p[0] + '" aria-selected="' + (state.page === p[0]) + '"><span class="s">&#9733;</span>' + p[1] + '</button>'; }).join(''); }
  function renderAll() {
    renderTabs();
    PAGES.forEach(function (p) { $('pg-' + p[0]).hidden = state.page !== p[0]; });
    if (state.page === 'calendar') renderCalendar();
    else if (state.page === 'ideas') { if (!($('inline-form') && $('inline-form').contains(document.activeElement))) renderIdeas(); }
    else if (state.page === 'menu') renderMenu();
    else if (state.page === 'profile') renderProfile();
  }
  function go(page) { state.page = page; renderAll(); window.scrollTo(0, 0); }

  /* ================= EVENTS ================= */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, .day'); if (!t) return; var ds = t.dataset;
    if (ds.page) go(ds.page);
    else if (ds.ym) { state.ym = ds.ym; state.sel = ds.ym + '-01'; renderAll(); }
    else if (ds.layer) { state.on[ds.layer] = !state.on[ds.layer]; renderAll(); }
    else if (ds.date && t.classList.contains('day')) { jump(ds.date); renderAll(); }
    else if (ds.add) openForm(ds.add);
    else if (ds.del) {
      if (ds.armed) { askRemove(ds.del); return; }
      var label = t.textContent; ds.armed = '1'; t.textContent = 'Confirm: ask to remove';
      setTimeout(function () { delete t.dataset.armed; if (t.isConnected) t.textContent = label; }, 3000);
    }
    else if (ds.idea) addIdea(ds.idea);
    else if (ds.ideaFilter) { state.idea = ds.ideaFilter; renderIdeas(); }
    else if (t.id === 'add-top') openForm(state.sel);
    else if (t.id === 'v-cal') { state.view = 'cal'; renderAll(); }
    else if (t.id === 'v-agenda') { state.view = 'agenda'; renderAll(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeForm();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('day')) { ev.preventDefault(); jump(ev.target.dataset.date); renderAll(); }
  });

  /* ================= BOOT ================= */
  var h = (location.hash || '').replace('#', ''); if (PAGES.some(function (p) { return p[0] === h; })) state.page = h;
  renderAll();
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
